[project]
name = "docket"
version = "0.1.0"
description = "The repo's courtroom: contracts, evidence, verdicts. File-native, deliberately boring."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel-yaml>=0.18",
]

[project.scripts]
docket = "docket.cli:entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]
